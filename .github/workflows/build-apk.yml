name: Build BisimNet APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install NDK and platform (SDK is preinstalled on the runner)
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | tail -1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-36" "ndk;25.1.8937393"
      - name: Fetch native audio libraries
        run: ./setup-native-deps.sh
      - name: Build debug APK
        run: chmod +x gradlew && ./gradlew assembleFossDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: bisimnet-debug-apk
          path: app/build/outputs/apk/foss/debug/*.apk
