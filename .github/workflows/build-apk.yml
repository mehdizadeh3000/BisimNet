name: Build BisimNet APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install NDK and platform (SDK is preinstalled on the runner)
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | tail -1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-36" "ndk;25.1.8937393"
      - name: Fetch native audio libraries
        run: bash setup-native-deps.sh
      - name: Build debug APK
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew assembleFossDebug --console=plain 2>&1 | tee build.log
      - name: Show the real error (only if the build failed)
        if: failure()
        run: |
          echo "===== WHAT WENT WRONG ====="
          grep -n -A12 "What went wrong" build.log | head -60 || true
          echo "===== COMPILER ERRORS ====="
          grep -n "error:" build.log | head -40 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log
      - uses: actions/upload-artifact@v4
        with:
          name: bisimnet-debug-apk
          path: app/build/outputs/apk/foss/debug/*.apk
